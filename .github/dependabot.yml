version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # docs はグループの PR を上限の数から除くと書いていない。同時に開きうるグループの PR が既定の 5 を超えるので上げる (ADR-0005)
    open-pull-requests-limit: 10
    # pnpm-workspace.yaml の minimumReleaseAge と .github/zizmor.yml の下限と対で持つ (ADR-0005)
    cooldown:
      default-days: 3
    ignore:
      # @types/node の major は Node の runtime (package.json の devEngines.runtime) と揃え、runtime と一緒に上げる。
      # minor を上げたら package.json の engines.node の下限もその minor まで上げる (ADR-0004)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # vitest と @vitest/* は vite-plus の同梱の版で決まるので bot に上げさせない。dependency-name だけの ignore は security update の PR も止める (ADR-0005)
      # 撤去条件: Vite+ の docs が、単独で先へ進む vitest の PR を作らせない bot の設定例を示したとき (voidzero-dev/vite-plus#2356)
      - dependency-name: "vitest"
      - dependency-name: "@vitest/*"
      # Playwright 1.65.1 が同梱する Chromium 159 は、iframe の中のボタンで view transition を始めると renderer が落ちる (microsoft/playwright#44133)。
      # 2026-11-23 に macOS の手元で、上流の再現は Chromium 159 で落ち、158 で通った。このテンプレートの今のテストは view transition をコードから始めるので落ちなかったが、ボタンから始めるテストを足すと全体の実行が止まりうる
      # 撤去条件: Chromium の修正 (https://issues.chromium.org/issues/588305519) を含む Playwright へ上げたとき。
      # 1.65.1 より後の版の PR は、同梱の Chromium に修正が入ったかを確かめてから取り込む (ADR-0005)
      - dependency-name: "playwright"
        versions: ["1.65.1"]
    groups:
      # vite-plus と core を 1 本の PR に束ねる。PR の扱いは docs/guides/dependencies-and-toolchain.md「Vite+ を上げる」 (ADR-0005)
      vite-plus:
        patterns:
          - "vite"
          - "vite-plus"
          - "@voidzero-dev/vite-plus-*"
          - "vitest"
          - "@vitest/*"
      # plugin-react と、それが呼ぶ optional peer を 1 本の PR にする (docs/guides/dependencies-and-toolchain.md「peer の食い違いを数える」)
      react-compiler:
        patterns:
          - "@vitejs/plugin-react"
          - "oxc-transform-react"
          - "@oxc-transform-react/*"
      # 片方だけが上がると peer の食い違いで落ちるか、依存先が 2 つの版で入る組を 1 本の PR にする。
      # major を見送るときは、組の依存ごとに update-types が semver-major の ignore を足し、撤去条件を書く (ADR-0005)
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      tailwindcss:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      # miniflare は exact で持ち、版は Void が引く @cloudflare/vite-plugin が解決する版に揃える (src/test/app/d1.ts が直接 import する)。
      # 別の版が入ると、テストの workerd と dev の workerd が食い違う。Void を上げたら vp why miniflare で
      # @cloudflare/vite-plugin の下の版を確かめ、package.json の miniflare を同じ版に書き換える。
      # Dependabot は miniflare を上げない。v5 は prerelease でだけ出ていて、Dependabot は今の版と release の部分が同じ
      # prerelease しか候補にしないので、void グループの PR に入らない (docs/guides/dependencies-and-toolchain.md「依存を上げたときに見直すもの」)
      # 撤去条件: Void が Miniflare の D1 を返すテスト用の入口を公開し、src/test/app/d1.ts が miniflare を import しなくなったとき (ADR-0005)
      # void と @void/react も exact で持つ。撤去条件: @void/react の peer の void が範囲になり、上の miniflare の撤去条件も成り立ったとき (ADR-0005)
      void:
        patterns:
          - "void"
          - "@void/*"
          - "miniflare"
      # patterns を持つほかのグループの依存をすべて除き、グループを変えたらここも変える。写さないと、組の依存が
      # 組のグループから外れてこの PR に入るか、両方のグループに入る (dependabot/dependabot-core#14576。
      # docs/guides/dependencies-and-toolchain.md「Vite+ を上げる」)
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "vite"
          - "vite-plus"
          - "@voidzero-dev/vite-plus-*"
          - "vitest"
          - "@vitest/*"
          - "@vitejs/plugin-react"
          - "oxc-transform-react"
          - "@oxc-transform-react/*"
          - "storybook"
          - "@storybook/*"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "tailwindcss"
          - "@tailwindcss/*"
          - "void"
          - "@void/*"
          - "miniflare"
