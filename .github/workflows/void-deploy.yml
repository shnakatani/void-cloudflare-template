# void init --github (Void 1.4.0) が Cloudflare 向けに生成する workflow を、テンプレートの CI の作法に合わせたもの。
# 生成物との差と、deploy しない repository で Disable にする扱いは ADR-0061
name: Deploy to Cloudflare
on:
  push:
    branches: [main]

concurrency:
  group: void-cloudflare-deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # secret はこの Environment に置き、main だけが読めるようにする。作り方は docs/guides/deployment.md「本番へ初めて出す」
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # credential を残さない (ADR-0006)
          persist-credentials: false

      # Node.js と pnpm を用意し、vp install まで走らせる。本番へ出す job なので、依存キャッシュは読まない (ADR-0061)
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0

      - name: Deploy
        env:
          # 権限は docs/guides/deployment.md「本番へ初めて出す」
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Worker の version に preview の URL が無いときだけ要る
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          # Cloudflare Access が readiness の確認を守るときだけ要る
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: vp exec void deploy --platform cloudflare
