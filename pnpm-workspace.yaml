# ===== Vite+ が管理 (vp migrate が書く。手で編集しない) =====

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vitest: 5.1.0
  vite-plus: 1.7.0
  "@vitest/browser-playwright": 5.1.0
  "@vitest/coverage-v8": 5.1.0
  "@vitest/ui": 5.1.0

# ===== 両方が書く (1 つのキーに vp migrate の行と手で足す行が同居する) =====

# vite@* / vitest@* は vp migrate が書く。vp pm audit --fix が足す行には撤去条件を書く (ADR-0005)
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
  # drizzle-kit (void の依存) が宣言だけして import しない依存を外す。持ち込む esbuild@0.18.20 が GHSA-67mh-4wv8-2f99 に当たる (drizzle-team/drizzle-orm#5481)
  # 撤去条件: drizzle-kit の安定版が @esbuild-kit/esm-loader を依存から外したとき
  "drizzle-kit>@esbuild-kit/esm-loader": "-"

# 待機の除外 (ADR-0005)。版の無い行は vp migrate が書く恒久除外で、編集しない。
# 手で足す行と vp pm audit --fix が足す行は版まで書く (@scope/pkg@x.y.z)
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
  - tsrs
  - "@tsrs/*"

# vitest の行は vp migrate が書き、消しても書き戻す。vite の行は vp migrate が消す (docs/guides/dependencies-and-toolchain.md「peer の食い違いを数える」)
peerDependencyRules:
  allowAny:
    - vitest
  allowedVersions:
    vitest: "*"
    # --- ここから下はこのテンプレートが追加 ---
    # storybook@10.6.8 の optional peer (vite-plus ^0.1.15 || ^0.2.0) が 1.0 に追いついていない。読むのは 1.0 も
    # export する vite-plus/versions だけ (2026-11-24 に storybook@10.6.8 の dist と vite-plus 1.7.0 の exports で確認)。撤去条件: storybook の peer が vite-plus 1.x を含んだとき
    # 値が major なので export が消えても鳴らない。上げたときの確認は docs/guides/dependencies-and-toolchain.md「peer の食い違いを数える」
    "storybook>vite-plus": "1"
    # @vitejs/plugin-react@6.3.0 の optional peer (oxc-transform-react >=0.152.0 <0.157.0) が 0.157.0 以降を受けない。
    # 0.157.0 から React Compiler の誤変換の修正 (oxc-project/oxc#28195) が入る。nullable な state のメンバーを閉包で読むと
    # cache guard が初回の描画で throw するものを含む。このリポジトリは React Compiler を有効にしているので (ADR-0014)、peer が広がるのを待たずに入れる
    # 撤去条件: plugin-react の peer が oxc-transform-react 0.158 を含んだとき
    "@vitejs/plugin-react>oxc-transform-react": "^0.158.0"

# ===== このテンプレートが追加 (vp migrate が書かない) =====

# pnpm の版は Vite+ が packageManager から選ぶ。pnpm に切り替えさせない (ADR-0004)
# Node.js は devEngines.runtime に onFail を書かずに pnpm に扱わせない。runtimeOnFail を置くと pnpm 11 が package.json に書き戻す (ADR-0004)
pmOnFail: ignore

allowBuilds:
  esbuild: true
  lightningcss: true
  sharp: true
  workerd: true

# 公開後 3 日 (4320 分) 未満の版を解決しない。.github/dependabot.yml の cooldown と
# .github/zizmor.yml の下限を同じ値に揃える (ADR-0005)
minimumReleaseAge: 4320

# lockfile が解決しなくなった除外を vp add / update / remove が消す (docs/guides/dependencies-and-toolchain.md「待機を前倒しする」)
minimumReleaseAgeExcludePrune: true

patchedDependencies:
  # FieldApi の validateSync が field の errorMap.onSubmit を消す条件を、検証の契機が change のときだけにする
  # (TanStack/form#2211 の差分を 1.33.5 の dist と src に写す)
  # 理由: 1.33.5 は submit 以外のどの契機 (blur を含む) でも消す。server のエラーと form の onSubmit の検証のエラーが、
  # 入力を変えずに欄を離れただけで消える。ActionForm は決着後に最初のエラーの欄へ focus を移すので、その欄から送信ボタンを
  # 押すと mousedown の blur でエラーの行が消え、ボタンが上へずれて最初の click が外れる
  # 撤去条件: 消す条件が change だけの版に上げたら消す。TanStack/form#1242 でメンテナは blur で消すのを v1 の意図とし、
  # v2 の alpha は change と blur の両方で消すので、上げても直らないことがある。当たらなければ作り直し、作れなければ
  # 欄を離れてもエラーを残す仕組みを選び直す。逆向きが当たると静かに通る (「patch のキーをパッケージ名だけにする理由」)
  # 確かめ方: use-page-action.test.tsx の「入力を変えずに欄を離れても残る」と「入力を変えずにもう一度送れる」。
  # 送信 (submitAction) を mock しても form-core は本物なので、vp run verify で捕まえる
  "@tanstack/form-core": patches/@tanstack__form-core.patch
  # DrizzleQueryError の message と params から bind した値を外す。上流が 1.0.0-rc.5 で既定にした振る舞い
  # (drizzle-team/drizzle-orm#5939 を閉じた commit 8e78e2b の errors.ts) を 0.45.4 の dist に写す。paramsInErrors の
  # option は写さない。Void の void/db は drizzle に schema と casing しか渡さず、渡す口が無い (ADR-0055)
  # 理由: 外すと、query の失敗を Void の onError と Better Auth が console.error に渡し、保存しようとした値と email がログに残る
  # 撤去条件: void の drizzle-orm の範囲が 1.0.0-rc.5 以降になったら消す
  # 確かめ方: src/test/drizzle-query-error.test.ts。miniflare の D1 で query を落とし、エラーに値が無いことを見る
  drizzle-orm: patches/drizzle-orm.patch
