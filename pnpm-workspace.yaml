# ===== Vite+ が管理 (vp migrate が書く。手で編集しない) =====

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  vite-plus: 1.4.0
  "@vitest/browser-playwright": 5.0.5
  "@vitest/coverage-v8": 5.0.5
  "@vitest/ui": 5.0.5

# ===== 両方が書く (1 つのキーに vp migrate の行と手で足す行が同居する) =====

# vite@* / vitest@* は vp migrate が書く。vp pm audit --fix が足す行には撤去条件を書く (ADR-0005)
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"

# 待機の除外 (ADR-0005)。版の無い行は vp migrate が書く恒久除外で、編集しない。
# 手で足す行と vp pm audit --fix が足す行は版まで書く (@scope/pkg@x.y.z)
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
  # 公開 3 日未満の版を、provenance を確かめて前倒しする (docs/guides/dependencies-and-toolchain.md「待機を前倒しする」)
  - void@1.4.0
  - "@void/react@1.4.0"
  - "@void/deploy-cloudflare@1.4.0"
  - "@void/deploy-core@1.4.0"
  - "@void/edge@1.4.0"
  - "@void/isr@1.4.0"
  - "@void/platform@1.4.0"

# vite / vitest の行は vp migrate が書き、消しても書き戻す (docs/guides/dependencies-and-toolchain.md「peer の食い違いを数える」)
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
    # --- ここから下はこのテンプレートが追加 ---
    # storybook@10.6.4 の optional peer (vite-plus ^0.1.15 || ^0.2.0) が 1.0 に追いついていない。読むのは 1.0 も
    # export する vite-plus/versions だけ (storybook@10.6.4 の dist で確認)。撤去条件: storybook の peer が vite-plus 1.x を含んだとき
    # 値が major なので export が消えても鳴らない。上げたときの確認は docs/guides/dependencies-and-toolchain.md「peer の食い違いを数える」
    "storybook>vite-plus": "1"

# ===== このテンプレートが追加 (vp migrate が書かない) =====

# pnpm の版は Vite+ が packageManager から選ぶ。pnpm に切り替えさせない (ADR-0004)
# Node.js は devEngines.runtime に onFail を書かずに pnpm に扱わせない。runtimeOnFail を置くと pnpm 11 が package.json に書き戻す (ADR-0004)
pmOnFail: ignore

allowBuilds:
  esbuild: true
  lightningcss: true
  sharp: true
  workerd: true

# 公開後 3 日 (4320 分) 未満の版を解決しない。.github/dependabot.yml の cooldown と
# .github/zizmor.yml の下限を同じ値に揃える (ADR-0005)
minimumReleaseAge: 4320

# lockfile が解決しなくなった除外を vp add / update / remove が消す (docs/guides/dependencies-and-toolchain.md「待機を前倒しする」)
minimumReleaseAgeExcludePrune: true

# @shadcn/lint が引く @typescript-eslint/parser は、oxlint 経由では読まれないのに eslint を必須 peer に持つ。optional にする (ADR-0023)
# utils には当てない。実行時に eslint を読む (docs/guides/lint/configuration.md「testing-library を story に限る理由」)
# 撤去条件: 上流が parser の eslint を optional peer にしたとき (shadcn-ui/lint#1)
packageExtensions:
  "@typescript-eslint/parser@^8":
    peerDependenciesMeta:
      eslint:
        optional: true

# Void の main の commit 5fd23eb (voidzero-dev/void#643 の修正) を 1.4.0 の dist に写す。2 つで 1 組
# 理由: React の action() が新しい props の commit を待ち、その commit は Action の終わりを待つので、Action の中で
# await action() すると決着しない (2026-11-02 に dev で観測)。void は createActionClient が _resolveOnShell を受け、
# @void/react はそれを渡す
# 撤去条件: 5fd23eb を含む版に上げたら 2 つとも消す。当たらない patch は vp install を ERR_PNPM_PATCH_FAILED で落とすが、
# 前向きに当たらなくても逆向きが当たれば成功になるので、5fd23eb を含む版では静かに通りうる
# (docs/guides/dependencies-and-toolchain.md「patch のキーをパッケージ名だけにする理由」)。落ちる主な原因は
# @void/react の chunk 名 (action-4EvQppia.mjs) の変更で、修正を含まない版でも変わりうる。
# 落ちたら、その版が 5fd23eb を含むかを見て、含めば 2 つとも消し、含まなければ作り直す。
# 静かに通る場合に備え、Void を上げたら確かめる
# 確かめ方: ActionButton の Action で usePageAction の run を await し、pending が解けて props が入れ替わること。
# use-page-action.test.tsx は action() を mock するので、vp run verify では捕まえない
patchedDependencies:
  # FieldApi の validateSync が field の errorMap.onSubmit を消す条件を、検証の契機が change のときだけにする
  # (TanStack/form#2211 の差分を 1.33.5 の dist と src に写す)
  # 理由: 1.33.5 は submit 以外のどの契機 (blur を含む) でも消す。server のエラーと form の onSubmit の検証のエラーが、
  # 入力を変えずに欄を離れただけで消える。ActionForm は決着後に最初のエラーの欄へ focus を移すので、その欄から送信ボタンを
  # 押すと mousedown の blur でエラーの行が消え、ボタンが上へずれて最初の click が外れる
  # 撤去条件: 消す条件が change だけの版に上げたら消す。TanStack/form#1242 でメンテナは blur で消すのを v1 の意図とし、
  # v2 の alpha は change と blur の両方で消すので、上げても直らないことがある。当たらなければ作り直し、作れなければ
  # 欄を離れてもエラーを残す仕組みを選び直す。逆向きが当たると静かに通る (「patch のキーをパッケージ名だけにする理由」)
  # 確かめ方: use-page-action.test.tsx の「入力を変えずに欄を離れても残る」と「入力を変えずにもう一度送れる」。
  # 送信 (submitAction) を mock しても form-core は本物なので、vp run verify で捕まえる
  "@tanstack/form-core": patches/@tanstack__form-core.patch
  "@void/react": patches/@void__react.patch
  void: patches/void.patch
